<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>ふたりのスロログ 試作版</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#f3f4f6;background:#0b1020}*{box-sizing:border-box}body{margin:0;padding:0 0 86px}.wrap{max-width:620px;margin:auto;padding:18px}h1{font-size:23px;margin:8px 0 3px}h2{font-size:18px;margin:0 0 12px}.sub{color:#aab3c5;font-size:12px}.card{background:#192236;border:1px solid #2e3b53;border-radius:18px;padding:17px;margin:14px 0;box-shadow:0 4px 18px #0002}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1;min-width:0}.metric{font-size:28px;font-weight:800;margin:8px 0}.green{color:#5ee2b0}.red{color:#ff8899}.small{font-size:13px;color:#b4bfd0}label{display:block;font-size:13px;color:#c4cee0;margin:12px 0 6px}input,select{width:100%;border:1px solid #42516d;background:#0e1729;color:white;border-radius:11px;padding:13px;font-size:16px}button{border:0;border-radius:12px;padding:13px 14px;background:#394967;color:white;font-size:14px;font-weight:700;cursor:pointer}button.primary{background:#59d8af;color:#0a1a21}button.warn{background:#e8a65a;color:#172032}button.danger{background:#6b3445;color:#fff}button:disabled{opacity:.5}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}.tabs{position:fixed;bottom:0;left:0;right:0;background:#111a2c;border-top:1px solid #314058;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:10}.tabs button{flex:1;max-width:180px;background:transparent;border-radius:0;color:#aab7cd;font-size:12px;padding:14px 4px}.tabs button.active{color:#5ee2b0}.hidden{display:none!important}.chip{display:inline-block;border-radius:20px;background:#2b3954;padding:6px 10px;margin:4px 4px 4px 0;font-size:12px}.entry{border-top:1px solid #33415a;padding:11px 0}.entry:first-child{border:0}.entry b{display:block;margin-bottom:4px}.muted{color:#8b99b2}canvas{width:100%;height:230px;display:block}.notice{background:#332b24;border:1px solid #776047;color:#ffe1b0;border-radius:12px;padding:11px;font-size:12px;line-height:1.6}.line{height:1px;background:#33415a;margin:14px 0}summary{cursor:pointer;color:#bfe6d9}.pill{border-radius:30px;padding:6px 9px;background:#2b3b55;font-size:12px}header{display:flex;align-items:center;justify-content:space-between}#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#294c43;padding:11px 16px;border-radius:12px;display:none;z-index:99;font-size:13px}svg{overflow:visible}#chart{width:100%;height:210px}#chart text{fill:#9aa9c0;font-size:11px}</style></head><body><div id="toast"></div><div class="wrap"><header><div><h1>🎰 ふたりのスロログ</h1><div class="sub">MONKEY TURN V · Prototype 0.3</div></div><span class="pill">試作版</span></header>
<section id="home"><div class="notice">⚠️ この試作版は、このブラウザ内にだけ記録を保存するよ。2人の端末間の同期はまだ未対応。端末のデータ削除で記録が消える場合があるため、本番データは入れずテストしてね。</div><div class="card"><div class="small">累計差枚（全期間）</div><div class="metric" id="total">±0枚</div><div class="row"><div><div class="small">ゆー</div><b id="yuTotal">±0枚</b></div><div><div class="small">くー</div><b id="bfTotal">±0枚</b></div></div></div><div class="card"><h2>📈 累計差枚の推移</h2><svg id="chart" viewBox="0 0 340 210" preserveAspectRatio="none" aria-label="累計差枚グラフ"></svg><div class="small">🟢 ゆー　🔵 くー　🟡 2人合算</div></div><button class="primary" style="width:100%" onclick="nav('play')">＋ 実践を記録する</button></section>
<section id="play" class="hidden"><div id="playBody"></div></section>
<section id="history" class="hidden"><div class="card"><h2>📖 実践履歴</h2><div id="historyBody"></div></div></section>
<section id="stats" class="hidden"><div class="card"><h2>📊 モンキーターンV 実戦統計</h2><div id="statsBody"></div></div></section>
<section id="settings" class="hidden"><div class="card" id="storeSettings"></div><div class="card"><h2>⚙️ データ管理</h2><p class="small">この試作版では機種はモンキーターンVのみ。記録は端末内に保存されるよ。</p><button onclick="exportData()">記録をJSONで書き出す</button><div class="line"></div><button class="danger" onclick="clearData()">テストデータを全削除</button></div></section></div>
<nav class="tabs"><button data-tab="home" class="active" onclick="nav('home')">🏠<br>ホーム</button><button data-tab="play" onclick="nav('play')">🎰<br>実践</button><button data-tab="history" onclick="nav('history')">📖<br>履歴</button><button data-tab="stats" onclick="nav('stats')">📊<br>統計</button><button data-tab="settings" onclick="nav('settings')">⚙️<br>設定</button></nav>
<script>
const KEY='slotlog_proto_v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{sessions:[],active:null}}catch(e){state={sessions:[],active:null}};if(state){for(const s of [...(state.sessions||[]),...(state.active?[state.active]:[])]){if(s.person==='彼氏')s.person='くー';if(s.tags)s.tags=s.tags.map(t=>t==='1/2後1周期狙い'?'ハイエナ':t);}localStorage.setItem(KEY,JSON.stringify(state));}const $=id=>document.getElementById(id);const fmt=n=>(n>0?'+':n<0?'':'±')+Number(n||0).toLocaleString('ja-JP')+'枚';const num=v=>Number(v)||0;const now=()=>new Date().toISOString();const stamp=v=>new Date(v).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});state.stores=state.stores||[];state.active&& (state.active.breakMinutes??=0);for(const x of state.sessions){x.breakMinutes??=0}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2100)}function nav(t){document.querySelectorAll('section').forEach(x=>x.classList.toggle('hidden',x.id!==t));document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));render();window.scrollTo(0,0)}function input(id,label,type='number',value='',placeholder=''){return `<label for="${id}">${label}</label><input id="${id}" type="${type}" value="${value}" placeholder="${placeholder}" ${type==='number'?'inputmode="numeric"':''}>`}function sessionDiff(s){return num(s.recovery)-num(s.investment)-num(s.carryIn)}function totalFor(name){return state.sessions.filter(s=>!name||s.person===name).reduce((a,s)=>a+sessionDiff(s),0)}function render(){renderPlay();renderHome();renderHistory();renderStats();renderSettings()}
function renderPlay(){let s=state.active;if(!s){$('playBody').innerHTML=`<div class="card"><h2>🎰 実践開始</h2><p class="small">まずはモンキーターンVで操作を試してみよう！</p><label>打ち手</label><select id="person"><option>ゆー</option><option>くー</option></select><label>店舗（設定から登録）</label><select id="store"><option value="">店舗を選択（未登録可）</option>${state.stores.map(t=>`<option value="${esc(t.name)}">${esc(t.name)}</option>`).join('')}</select>${input('machineNo','台番号','text','','例：123')}${input('startG','着席時G数','number',0)}<label>前の台からの持ちメダル引き継ぎ</label><select id="carryMode"><option value="0">引き継がない</option>${carryChoices()}</select><p class="small">持ちメダルを引き継ぐ場合、前の台の終了枚数が次の台の持ち込み枚数になるよ。</p><label>着席条件（任意・複数選択）</label><div id="tags">${['リセット','1周期狙い','ハイエナ','洞口ヘルメット','浜岡ヘルメット','青島ヘルメット','モノクロ','キラキラ','ロゴキラ','ロゴキラV','その他'].map(t=>`<label style="display:inline-block;margin:5px"><input type="checkbox" class="tag" value="${t}" style="width:auto"> ${t}</label>`).join('')}</div><button class="primary" style="width:100%;margin-top:15px" onclick="startSession()">実践スタート</button></div>`;return}
let events=s.events.map((e,i)=>`<div class="entry"><b>${i+1}. ${e.kind==='hit'?'🔥 初当たり':e.kind==='at'?'🏁 ATリザルト':e.kind==='invest'?'💰 投資追加':e.kind==='helmet'?'🪖 ヘルメット':'⭐ イベント'} <span class="small">${stamp(e.time)}</span></b><div class="small">${e.kind==='hit'?`${e.g}G / 契機：${esc(e.reason||'未入力')}`:e.kind==='at'?`${esc(e.atType)} / ${e.payout}枚 / ${e.chains||'–'}連`:e.kind==='invest'?`${e.amount}枚`:e.kind==='helmet'?`${esc(e.before||'未記録')} → ${esc(e.after)} / ${esc(e.note||'')}`:esc(e.name)+' / '+esc(e.outcome||'')}</div><button style="margin-top:6px;padding:7px 12px" onclick="removeEvent(${i})">取り消し</button></div>`).join('');$('playBody').innerHTML=`<div class="card"><div class="small">実践中 · ${stamp(s.startTime)}</div><h2>🏍️ モンキーターンV</h2><div class="small">${esc(s.person)} / ${esc(s.store||'店舗未入力')} / ${esc(s.machineNo||'台番未入力')}番台</div><div class="small">開始 ${s.startG}G　${s.tags.map(esc).join('・')}</div><div class="line"></div><div class="row"><div><div class="small">追加投資</div><b>${s.investment.toLocaleString()}枚</b><div class="small">持ち込み ${num(s.carryIn)}枚</div></div><div><div class="small">初当たり</div><b>${s.events.filter(e=>e.kind==='hit').length}回</b></div></div><div class="buttons"><button class="primary" onclick="showForm('hit')">🔥 初当たり</button><button onclick="showForm('at')">🏁 ATリザルト</button><button onclick="showForm('invest')">💰 投資追加</button><button onclick="showForm('event')">⭐ イベント</button><button onclick="showForm('helmet')">🪖 ヘルメット</button><button onclick="showForm('break')">☕ 休憩時間</button></div><div class="small">休憩 ${num(s.breakMinutes)}分 ／ 実稼働 ${durationLabel(s,now())}</div><div id="eventForm"></div><h2 style="margin-top:18px">記録タイムライン</h2>${events||'<p class="small">まだイベントはないよ。</p>'}<div class="line"></div><button class="warn" style="width:100%" onclick="showForm('finish')">実践を終了する</button></div>`}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function startSession(){let g=num($('startG').value);if(g<0){toast('G数を確認してね');return}state.active={id:Date.now(),person:$('person').value,store:$('store').value.trim(),machineNo:$('machineNo').value.trim(),startG:g,tags:[...document.querySelectorAll('.tag:checked')].map(x=>x.value),startTime:now(),investment:0,carryIn:num($('carryMode').value),breakMinutes:0,events:[]};save();render();toast('実践開始！')}
function showForm(k){let body={hit:`<h2>🔥 初当たりを追加</h2>${input('g','当選G数','number','')}${input('reason','当選契機（任意）','text','','例：周期・直撃')}<p class="small">投資枚数は「投資追加」で別途記録するよ。</p>`,at:`<h2>🏁 ATリザルト</h2><label>区間</label><select id="atType"><option>通常SG</option><option>青島SG</option></select>${input('payout','リザルト獲得枚数','number','')}${input('chains','連チャン数（任意）','number','')}<p class="small">区間ごとのリザルト値を記録。投資・最終回収には加算しないよ。</p>`,invest:`<h2>💰 投資追加</h2>${input('amount','追加投資枚数','number','')}`,helmet:`<h2>🪖 ヘルメット示唆</h2><label>変化前</label><select id="helmetBefore">${helmetOptions()}</select><label>変化後</label><select id="helmetAfter">${helmetOptions()}</select>${input('helmetNote','メモ（任意）','text','','例：AT終了後')}`,break:`<h2>☕ 休憩時間</h2><div class="row"><button onclick="changeBreak(-5)">−5分</button><b id="breakDisplay" style="text-align:center">${num(state.active.breakMinutes)}分</b><button onclick="changeBreak(5)">＋5分</button></div><p class="small">休憩時間は実稼働時間から差し引くよ。</p>`,event:`<h2>⭐ イベント追加</h2><label>イベント</label><select id="eventName"><option>グランドスラム</option><option>上位CZ</option><option>CZ</option><option>その他</option></select><label>結果</label><select id="outcome"><option value="">記録のみ</option><option>成功</option><option>失敗</option></select>`,finish:`<h2>🏁 実践終了</h2>${input('endG','終了G数','number','')}${input('totalG','この台で回した総ゲーム数（機械割推定用）','number','')}${input('recovery','やめた時点の最終持ちメダル枚数','number','')}<p class="small">差枚は終了時の枚数 − 持ち込み枚数 − 追加投資で計算。ATリザルトは足さないよ。</p>`}[k];$('eventForm').innerHTML=`<div class="card" style="background:#111b2d">${body}<div class="buttons"><button onclick="showFormCancel()">キャンセル</button><button class="primary" onclick="submitEvent('${k}')">${k==='finish'?'実践を保存':k==='break'?'閉じる':'追加して保存'}</button></div></div>`;$('eventForm').scrollIntoView({behavior:'smooth',block:'nearest'})}function showFormCancel(){$('eventForm').innerHTML=''}function valid(id){const el=$(id);if(!el||el.value.trim()===''||!Number.isFinite(Number(el.value))||Number(el.value)<0){toast('数値を正しく入力してね');return null}return Number(el.value)}function submitEvent(k){let s=state.active,e={kind:k,time:now()};if(k==='hit'){e.g=valid('g');if(e.g===null)return;e.reason=$('reason').value.trim()}if(k==='at'){e.payout=valid('payout');if(e.payout===null)return;e.atType=$('atType').value;e.chains=$('chains').value.trim()===''?null:valid('chains');if(e.chains===null&&$('chains').value.trim()!=='')return}if(k==='invest'){e.amount=valid('amount');if(e.amount===null)return;s.investment+=e.amount}if(k==='helmet'){e.before=$('helmetBefore').value;e.after=$('helmetAfter').value;e.note=$('helmetNote').value.trim()}if(k==='break'){save();renderPlay();toast('休憩時間を保存したよ');return}if(k==='event'){e.name=$('eventName').value;e.outcome=$('outcome').value}if(k==='finish'){const g=valid('endG'),r=valid('recovery');if(g===null||r===null)return;s.endG=g;s.recovery=r;s.endTime=now();s.totalG=$('totalG').value.trim()===''?0:valid('totalG');if(s.totalG===null)return;state.sessions.push(s);state.active=null;save();nav('home');toast('実践を保存したよ！');return}s.events.push(e);save();renderPlay();toast('記録したよ！')}function removeEvent(i){if(!confirm('このイベントを取り消す？'))return;let s=state.active,e=s.events[i];if(e.kind==='invest')s.investment-=e.amount;s.events.splice(i,1);save();renderPlay()}
function renderHome(){let a=totalFor('ゆー'),b=totalFor('くー');$('total').textContent=fmt(a+b);$('yuTotal').textContent=fmt(a);$('bfTotal').textContent=fmt(b);drawChart()}
function drawChart(){let list=[...state.sessions].sort((a,b)=>new Date(a.endTime)-new Date(b.endTime)),y=0,b=0,pts=[{y:0,b:0,t:0}];for(const s of list){if(s.person==='ゆー')y+=sessionDiff(s);else b+=sessionDiff(s);pts.push({y,b,t:y+b})}const values=pts.flatMap(p=>[p.y,p.b,p.t]);let lo=Math.min(0,...values),hi=Math.max(0,...values);if(hi===lo){hi+=100;lo-=100}const X=i=>36+(i/(Math.max(1,pts.length-1)))*288,Y=v=>180-(v-lo)/(hi-lo)*150;let svg=`<line x1="36" y1="30" x2="36" y2="180" stroke="#516078"/><line x1="36" y1="${Y(0)}" x2="325" y2="${Y(0)}" stroke="#6c788f" stroke-dasharray="4 4"/><text x="3" y="35">${hi}</text><text x="3" y="183">${lo}</text>`;for(const [k,c] of [['y','#5ee2b0'],['b','#6dafff'],['t','#f8d17c']]){svg+=`<polyline fill="none" stroke="${c}" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" points="${pts.map((p,i)=>`${X(i)},${Y(p[k])}`).join(' ')}"/>`}svg+=`<text x="36" y="202">開始</text><text x="285" y="202">最新</text>`;$('chart').innerHTML=svg}
function renderHistory(){let h=$('historyBody');if(!state.sessions.length){h.innerHTML='<p class="small">まだ終了した実践はないよ。</p>';return}h.innerHTML=[...state.sessions].reverse().map(s=>`<div class="entry"><b>${stamp(s.startTime)} · ${esc(s.person)} <span class="${sessionDiff(s)>=0?'green':'red'}">${fmt(sessionDiff(s))}</span></b><div class="small">${esc(s.store||'店舗未入力')} / モンキーターンV / ${esc(s.machineNo||'–')}番台</div><div class="small">持込 ${num(s.carryIn)}枚 ＋ 追加 ${s.investment}枚 → 終了 ${s.recovery}枚 · 初当たり ${s.events.filter(e=>e.kind==='hit').length}回 · AT ${s.events.filter(e=>e.kind==='at').length}件</div><details><summary>記録を表示</summary><p class="small">実稼働 ${durationLabel(s,s.endTime)} / 休憩 ${num(s.breakMinutes)}分 / 開始 ${s.startG}G → 終了 ${s.endG}G / ${s.tags.map(esc).join('・')}</p>${s.events.map(e=>`<div class="small">${stamp(e.time)} ${e.kind==='hit'?`初当たり ${e.g}G`:e.kind==='at'?`${esc(e.atType)} ${e.payout}枚`:e.kind==='invest'?`投資 +${e.amount}枚`:e.kind==='helmet'?`ヘルメット ${esc(e.before)} → ${esc(e.after)} ${esc(e.note||'')}`:`${esc(e.name)} ${esc(e.outcome)}`}</div>`).join('')}</details><button class="danger" style="padding:7px 12px;margin-top:8px" onclick="deleteSession(${s.id})">この実践を削除</button></div>`).join('')}
function deleteSession(id){if(!confirm('この実践を削除する？'))return;state.sessions=state.sessions.filter(s=>s.id!==id);save();render()}function minutes(s,end){return Math.max(0,(new Date(end||now())-new Date(s.startTime))/60000-num(s.breakMinutes))}function durationLabel(s,end){let m=Math.floor(minutes(s,end));return `${Math.floor(m/60)}時間${m%60}分`}function rate(s){let st=state.stores.find(x=>x.name===s.store);return st&&num(st.exchange)>0?1000/num(st.exchange):null}function money(n){return Math.round(n).toLocaleString('ja-JP')+'円'}function yenPerHour(s){let r=rate(s),h=minutes(s,s.endTime)/60;return r&&h>0?money(sessionDiff(s)*r/h)+'/h':'–'}function machineRate(s){let g=num(s.totalG);return g>0?(100*(1+sessionDiff(s)/(3*g))).toFixed(2)+'%':'–'}function renderStats(){let hits=0,ats=[],byType={},mins=0,weightedYen=0,hasRate=true,games=0,diff=0;for(const s of state.sessions){hits+=s.events.filter(e=>e.kind==='hit').length;mins+=minutes(s,s.endTime);diff+=sessionDiff(s);games+=num(s.totalG);let r=rate(s);if(r)weightedYen+=sessionDiff(s)*r;else hasRate=false;for(const e of s.events.filter(e=>e.kind==='at')){ats.push(e);(byType[e.atType]??=[]).push(e.payout)}}let avg=a=>a.length?(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1):'–';let hourly=mins>0&&hasRate?money(weightedYen/(mins/60))+'/h':'–';let mach=games>0?(100*(1+diff/(3*games))).toFixed(2)+'%':'–';$('statsBody').innerHTML=`<div class="row"><div><div class="small">終了実践</div><b>${state.sessions.length}台</b></div><div><div class="small">初当たり</div><b>${hits}回</b></div></div><div class="line"></div><div class="row"><div><div class="small">合計差枚</div><b>${fmt(diff)}</b></div><div><div class="small">実稼働合計</div><b>${(mins/60).toFixed(1)}時間</b></div></div><div class="row" style="margin-top:16px"><div><div class="small">参考時給（交換換算）</div><b>${hourly}</b></div><div><div class="small">推定機械割</div><b>${mach}</b></div></div><p class="small">※時給は店舗の交換レートで換算。機械割は総ゲーム数×3枚投入と仮定した推定値で、実測の機械割ではないよ。</p><div class="line"></div><div class="small">ATリザルト記録数</div><div class="metric">${ats.length}件</div><div class="small">全ATリザルト平均：${avg(ats.map(e=>e.payout))}枚</div>${Object.entries(byType).map(([k,v])=>`<div class="entry"><b>${esc(k)}</b><div class="small">${v.length}件 / リザルト平均 ${avg(v)}枚</div></div>`).join('')}<p class="small">※区間リザルトは差枚に加算しないよ。</p>`}
function helmetOptions(){return ['未記録','通常','ロゴあり','キラキラ','Vロゴ','洞口','浜岡','青島','モノクロ','ロゴキラ','ロゴキラV','その他'].map(x=>`<option>${x}</option>`).join('')}function changeBreak(v){state.active.breakMinutes=Math.max(0,num(state.active.breakMinutes)+v);save();$('breakDisplay').textContent=state.active.breakMinutes+'分'}function carryChoices(){let p=state.sessions[state.sessions.length-1];return p?`<option value="${num(p.recovery)}">前の台から ${num(p.recovery)}枚を引き継ぐ</option>`:''}
function renderSettings(){$('storeSettings').innerHTML=`<h2>🏬 店舗別レート設定</h2><p class="small">例：1000円で46枚貸出・50枚交換なら、46 / 50 を入力してね。</p>${input('newStore','店舗名','text','','例：○○店')}${input('lendRate','貸出枚数（1000円あたり）','number','46')}${input('exchangeRate','交換枚数（1000円あたり）','number','50')}<button class="primary" style="width:100%;margin-top:12px" onclick="addStore()">店舗を登録・更新</button>${state.stores.map(t=>`<div class="entry"><b>${esc(t.name)}</b><div class="small">貸出 ${t.lend}枚 / 交換 ${t.exchange}枚（1000円あたり）</div></div>`).join('')}`}
function addStore(){let name=$('newStore').value.trim(),lend=num($('lendRate').value),exchange=num($('exchangeRate').value);if(!name||lend<=0||exchange<=0){toast('店舗名とレートを確認してね');return}state.stores=state.stores.filter(x=>x.name!==name);state.stores.push({name,lend,exchange});save();renderSettings();toast('店舗を登録したよ！')}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='slotlog-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function clearData(){if(!confirm('テストデータをすべて削除する？'))return;state={sessions:[],active:null,stores:[]};save();nav('home')}render();
</script></body></html>
